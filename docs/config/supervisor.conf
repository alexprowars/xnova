[program:xnova-ws]
process_name=%(program_name)s_%(process_num)02d
directory=/path/to/xnova
command=php artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=xnova
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/xnova/storage/logs/worker.log

[program:xnova-ssr]
process_name=%(program_name)s_%(process_num)02d
directory=/path/to/xnova
command=php artisan inertia:start-ssr
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=xnova
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/xnova/storage/logs/worker.log
stopwaitsecs=3600

[program:xnova-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/path/to/xnova
command=php artisan queue:work --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=xnova
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/xnova/storage/logs/worker.log
stopwaitsecs=3600

[program:xnova-daemon-fleet]
process_name=%(program_name)s_%(process_num)02d
directory=/path/to/xnova
command=php artisan game:daemon fleet
user=xnova
numprocs=1
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=300
redirect_stderr=true

[program:xnova-daemon-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/path/to/xnova
command=php artisan game:daemon queue
user=xnova
numprocs=1
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=300
redirect_stderr=true
